# ==============================================================================
# Nginx Configuration for fosslubricants.com
# Features:
# 1. Clean URLs (automatic extensionless routing: /about -> /about.html)
# 2. Strict 301 canonical redirects (from .html to extensionless)
# 3. Aggressive static asset caching with cache-busting support
# 4. Security headers & Gzip/Brotli compression
# ==============================================================================

server {
    listen 80;
    server_name fosslubricants.com www.fosslubricants.com;
    return 301 https://www.fosslubricants.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fosslubricants.com;
    
    # SSL certificates handled by Let's Encrypt / Cloudflare Origin CA
    ssl_certificate /etc/letsencrypt/live/fosslubricants.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fosslubricants.com/privkey.pem;

    return 301 https://www.fosslubricants.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.fosslubricants.com;

    root /var/www/fosslubricants.com;
    index index.html;

    # SSL Settings
    ssl_certificate /etc/letsencrypt/live/fosslubricants.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fosslubricants.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Redirect requests with .html suffix to extensionless URL (301 Permanent)
    if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
        return 301 /$1$is_args$args;
    }

    # 2. Extensionless URL Resolution
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 3. Static Media & Assets Caching (1 Year max-age with revalidation)
    location ~* \.(?:webp|jpg|jpeg|png|gif|svg|ico|woff2|woff|ttf|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 4. XML Sitemap & Robots.txt
    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # 5. Custom Error Pages
    error_page 404 /404.html;
}
